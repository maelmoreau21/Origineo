services:
  postgres:
    image: postgres:18-alpine
    container_name: origineo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-origineo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-origineo_secret}
      POSTGRES_DB: ${POSTGRES_DB:-origineo}
    ports:
      - "127.0.0.1:5432:5432"
    # Attention : Depuis PostgreSQL 18, PGDATA est sous /var/lib/postgresql/18/docker
    # Le volume doit donc être monté sur /var/lib/postgresql (et non plus /var/lib/postgresql/data)
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-origineo} -d ${POSTGRES_DB:-origineo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  origineo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: origineo-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-origineo}:${POSTGRES_PASSWORD:-origineo_secret}@postgres:5432/${POSTGRES_DB:-origineo}
      JWT_SECRET: ${JWT_SECRET:-change-me-super-secret-jwt-key-32-chars}
      STORAGE_PATH: /app/storage
      STATIC_DIR: /app/static
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # ─── SSO OpenID Connect (OIDC + PKCE S256) ─────────────────────
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:8080/api/auth/oidc/callback}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email groups}
      OIDC_ROLE_CLAIM: ${OIDC_ROLE_CLAIM:-groups}
      OIDC_ADMIN_VALUES: ${OIDC_ADMIN_VALUES:-admin,administrateur,origineo-admin}
      OIDC_MODIFIER_VALUES: ${OIDC_MODIFIER_VALUES:-modifier,modificateur,editor,origineo-modifier}
      OIDC_READER_VALUES: ${OIDC_READER_VALUES:-reader,lecteur,viewer,origineo-reader}
      OIDC_DEFAULT_ROLE: ${OIDC_DEFAULT_ROLE:-READER}
      OIDC_REQUIRE_GROUP: ${OIDC_REQUIRE_GROUP:-false}
      OIDC_BUTTON_LABEL: ${OIDC_BUTTON_LABEL:-Se connecter avec SSO (OIDC)}
      OIDC_DEV_MOCK: ${OIDC_DEV_MOCK:-true}
    volumes:
      - origineo_storage:/app/storage
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
  origineo_storage:
