services:
  postgres:
    image: postgres:18-alpine
    container_name: origineo-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-origineo}
    # Attention : Depuis PostgreSQL 18, PGDATA est sous /var/lib/postgresql/18/docker
    # Le volume doit donc être monté sur /var/lib/postgresql
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-origineo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  origineo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: origineo-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-origineo}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      STORAGE_PATH: /app/storage
      STATIC_DIR: /app/static
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?OIDC_ISSUER_URL is required}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?OIDC_CLIENT_ID is required}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET is required}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:?OIDC_REDIRECT_URI is required}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email groups}
      OIDC_ROLE_CLAIM: ${OIDC_ROLE_CLAIM:-groups}
      OIDC_ADMIN_VALUES: ${OIDC_ADMIN_VALUES:-admin,administrateur,origineo-admin}
      OIDC_MODIFIER_VALUES: ${OIDC_MODIFIER_VALUES:-modifier,modificateur,editor,origineo-modifier}
      OIDC_READER_VALUES: ${OIDC_READER_VALUES:-reader,lecteur,viewer,origineo-reader}
      OIDC_DEFAULT_ROLE: ${OIDC_DEFAULT_ROLE:-READER}
      OIDC_REQUIRE_GROUP: ${OIDC_REQUIRE_GROUP:-true}
      OIDC_BUTTON_LABEL: ${OIDC_BUTTON_LABEL:-Se connecter avec SSO (OIDC)}
      OIDC_DEV_MOCK: "false"
    volumes:
      - origineo_storage:/app/storage
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
  origineo_storage:
