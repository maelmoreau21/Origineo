[package]
name = "origineo-api"
version = "2.0.0"
edition = "2024"
description = "Ultra-high performance genealogical tree server in Rust (Axum + SQLx + Svelte 5 SPA)"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "compression-gzip", "limit"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.29", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
thiserror = "2.0"
anyhow = "1.0"
url = "2.5"
urlencoding = "2.1"
unicode-normalization = "0.1"
regex = "1.11"
dashmap = "6.1"
mime_guess = "2.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
